test_cases_builders:
- name: main
  description: Makes everything but install files and sdf worlds
  instruction: |
      > [!IMPORTANT]
      > ## Build from source on Windows
      > Binaries are not yet available for windows so you will first need to build Gazebo Jetty from source following the instructions in
      > https://gazebosim.org/docs/jetty/install_windows_src/
  set:
  - !Include
    all_labels: null
    negate: false
  - !Exclude
    any_names: [install, src]
    all_labels: [docs]
    negate: false
  - !Exclude
    all_labels: [sdf worlds]
    negate: false
  - !Exclude
    all_labels: [sdf_tutorials]
    negate: false
  - !Exclude
    all_labels: [gz-transport]
    any_names: [installation, messages, services]
    negate: false
  permutations:
    os:
    # - MacOS
    # - Ubuntu Noble
    - Windows

- name: sdf_worlds
  description: The SDF worlds can be run on any platform
  instruction: |
      > [!IMPORTANT]
      > ## Build from source on Windows
      > If you are using Windows, note that binaries are not yet available, so you will first need to build Gazebo Jetty
      > from source following the instructions in https://gazebosim.org/docs/jetty/install_windows_src/
  set:
  - !Include
    all_labels: [sdf worlds]
    negate: false
  permutations:
    os:
      - Any
  labels: [easy]

