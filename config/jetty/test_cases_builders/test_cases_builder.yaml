- name: transport_with_zenoh
  description: >
    Test gz-transport with Zenoh. In each terminal, run `export GZ_TRANSPORT_IMPLEMENTATION=zenoh` before running any of the commands in the tutorial.
  set:
  - !Include
    all_labels: [gz-transport]
    any_names: [installation, messages, services]
    negate: false
  permutations:
    os:
    # - MacOS
    # - Ubuntu Noble
    - Windows
    transport:
    - zeromq
    - zenoh
